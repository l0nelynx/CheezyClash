appId: com.cheezy.freedom.desktop
productName: CheezyClash
executableName: CheezyClash
copyright: Copyright © CheezyClash
protocols:
  - name: CheezyClash
    schemes:
      - cheezyclash
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
afterPack: scripts/after-pack.mjs
extraResources:
  - from: build/startup-task.ps1
    to: startup-task.ps1
  - from: build/installer-processes.ps1
    to: helper-control.ps1
  - from: resources/core
    to: core
    filter:
      - '**/*'
  - from: resources/helper
    to: helper
    filter:
      - '**/*'
  - from: resources/tray.png
    to: tray.png
  - from: build/icon.png
    to: build/icon.png
  - from: build/icon.ico
    to: build/icon.ico
win:
  icon: build/icon.ico
  # Disable Authenticode signing; afterPack still applies icon + ProductName via resedit
  sign: false
  target:
    - nsis
    - zip
  artifactName: CheezyClash-win-${arch}.${ext}
nsis:
  oneClick: false
  installerLanguages:
    - en_US
    - ru_RU
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CheezyClash
  uninstallDisplayName: CheezyClash
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Network
  artifactName: CheezyClash-linux-${arch}.${ext}
mac:
  # Ad-hoc signatures support Apple Silicon without a Developer ID certificate.
  # This build is not notarized; see docs/macos-install.md for Gatekeeper setup.
  notarize: false
  sign:
    identity: '-'
    # No Team ID: hardened library validation would reject the ad-hoc bundle.
    hardenedRuntime: false
    binaries:
      - Contents/Resources/core/mihomo
      - Contents/Resources/helper/cheezy-helper
  icon: build/icon.png
  target:
    - dmg
    - zip
  artifactName: CheezyClash-mac-${arch}.${ext}
  category: public.app-category.utilities
