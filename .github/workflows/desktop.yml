name: Desktop CI

# PR: static/unit checks and native macOS TUN smoke tests (no electron-builder).
# Full installers: release.yml on v* tags, or this workflow via workflow_dispatch.
# Caching prior dist for tags is a poor fit — release commits almost always bump
# version, so the package must be rebuilt anyway.

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/*ci*.py'
      - 'scripts/publish_core.py'
      - 'scripts/validate_native_cache.py'
      - 'scripts/verify_release_assets.py'
      - '.github/workflows/release.yml'
      - '.github/actions/libclash/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      package:
        description: "Run full electron-builder matrix (win/linux/mac)"
        type: boolean
        default: true

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install deps
        run: npm ci
      - name: Sync version
        run: npm run sync-version
      - name: Build mihomo sidecar from root Go module
        run: npm run build-core
      - name: Verify core artifact contract
        run: npm run test:core-manifest
      - name: Build helper
        run: npm run build:helper
      - name: Linux helper protocol and lifecycle
        run: npm run test:linux-helper && npm run test:mac-helper && npm run test:mac-package && cd helper && go test -race ./...
      - name: Typecheck
        run: npm run typecheck
      - name: Deep-link matrix / privacy
        run: npm run test:deeplink && npm run test:core-contract && npm run test:controller && npm run test:lifecycle && npm run test:network-config && npm run test:installer && npm run test:ci-resilience
      - name: Build
        run: npm run build
  mac-tun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: npm ci
      - run: npm run fetch-core && npm run build:helper
      - name: Protocol, peer credentials and native sandbox
        run: |
          npm run test:mac-helper
          cd helper
          go test ./...
          go test -c -o ../resources/helper/mac-helper-tests ./internal/machelper
          sudo -n ../resources/helper/mac-helper-tests -test.run '^TestNativeSandbox$' -test.v
          rm ../resources/helper/mac-helper-tests
      - name: Real TUN installation, DNS and network restoration
        run: node scripts/smoke-macos-tun.mjs
      - name: Collect macOS sandbox failure diagnostics
        if: failure()
        run: |
          sudo -n /usr/bin/log show --last 3m --style compact \
            --predicate 'eventMessage CONTAINS[c] "deny" AND (process == "kernel" OR process == "sandboxd")' | tail -n 100
          sudo -n find /Library/Logs/DiagnosticReports "$HOME/Library/Logs/DiagnosticReports" \
            -name 'mihomo*' -type f -mmin -5 -exec head -c 16000 {} \;

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: [check, mac-tun]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install deps
        run: npm ci
      - name: Fetch mihomo sidecar
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run fetch-core
      - name: Build helper
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run build:helper
      - name: Check Windows installer (compile only, no installation)
        if: matrix.target == 'win'
        run: npm run icons && npm run test:installer -- --compile
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          if [ -n "${{ matrix.arch }}" ]; then
            npm run dist:${{ matrix.target }} -- --${{ matrix.arch }}
          else
            npm run dist:${{ matrix.target }}
          fi
        continue-on-error: ${{ matrix.target != 'win' }}
      - name: Validate Windows protocol handler
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "release/win-unpacked/CheezyClash.exe").Path
          if (Test-Path "release/win-unpacked/resources/private") {
            throw "Open artifact contains proprietary resources"
          }
          $process = Start-Process $exe -ArgumentList "--disable-gpu" -PassThru
          try {
            $command = $null
            for ($i = 0; $i -lt 20 -and -not $command; $i++) {
              Start-Sleep -Milliseconds 500
              $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                "Software\Classes\cheezyclash\shell\open\command"
              )
              if ($key) {
                $command = [string]$key.GetValue("")
                $key.Dispose()
              }
            }
            if (-not $command -or $command -notmatch "CheezyClash\.exe" -or $command -match "electron\.exe") {
              throw "Invalid cheezyclash handler: $command"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Validate Linux protocol metadata
        if: matrix.target == 'linux'
        shell: bash
        run: |
          test ! -d release/linux-unpacked/resources/private
          DEB=$(find release -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB"
          OUT=$(mktemp -d)
          dpkg-deb -x "$DEB" "$OUT"
          grep -R -q 'x-scheme-handler/cheezyclash' "$OUT/usr/share/applications"
      - name: Validate macOS app and packaged TUN
        if: matrix.target == 'mac'
        shell: bash
        run: |
          APP=$(find release -maxdepth 2 -name 'CheezyClash.app' -print -quit)
          test -n "$APP"
          test ! -d "$APP/Contents/Resources/private"
          plutil -p "$APP/Contents/Info.plist" | grep -q 'cheezyclash'
          codesign --verify --deep --strict "$APP"
          node scripts/smoke-macos-tun.mjs --app "$APP"
      - name: Upload Windows artifacts
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: CheezyClash-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: CheezyClash-linux
          path: desktop/release/*
          if-no-files-found: error
      - name: Upload macOS artifacts
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: CheezyClash-macos-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
