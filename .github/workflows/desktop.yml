name: Desktop CI

# Push/PR: cheap checks only (no electron-builder).
# Full installers: release.yml on v* tags, or this workflow via workflow_dispatch.
# Caching prior dist for tags is a poor fit — release commits almost always bump
# version, so the package must be rebuilt anyway.

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      package:
        description: "Run full electron-builder matrix (win/linux/mac)"
        type: boolean
        default: true

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Install deps
        run: npm ci
      - name: Sync version
        run: npm run sync-version
      - name: Fetch mihomo sidecar
        run: npm run fetch-core
      - name: Build helper
        run: npm run build:helper
      - name: Typecheck
        run: npm run typecheck
      - name: Deep-link matrix / privacy
        run: npm run test:deeplink
      - name: Build
        run: npm run build
  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-latest
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Install deps
        run: npm ci
      - name: Fetch mihomo sidecar
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run fetch-core
      - name: Build helper
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run build:helper
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          if [ -n "${{ matrix.arch }}" ]; then
            npm run dist:${{ matrix.target }} -- --${{ matrix.arch }}
          else
            npm run dist:${{ matrix.target }}
          fi
        continue-on-error: ${{ matrix.target != 'win' }}
      - name: Validate Windows protocol handler
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "release/win-unpacked/CheezyClash.exe").Path
          if (Test-Path "release/win-unpacked/resources/private") {
            throw "Open artifact contains proprietary resources"
          }
          $process = Start-Process $exe -ArgumentList "--disable-gpu" -PassThru
          try {
            $command = $null
            for ($i = 0; $i -lt 20 -and -not $command; $i++) {
              Start-Sleep -Milliseconds 500
              $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                "Software\Classes\cheezyclash\shell\open\command"
              )
              if ($key) {
                $command = [string]$key.GetValue("")
                $key.Dispose()
              }
            }
            if (-not $command -or $command -notmatch "CheezyClash\.exe" -or $command -match "electron\.exe") {
              throw "Invalid cheezyclash handler: $command"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Validate Linux protocol metadata
        if: matrix.target == 'linux'
        shell: bash
        run: |
          test ! -d release/linux-unpacked/resources/private
          DEB=$(find release -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB"
          OUT=$(mktemp -d)
          dpkg-deb -x "$DEB" "$OUT"
          grep -R -q 'x-scheme-handler/cheezyclash' "$OUT/usr/share/applications"
      - name: Validate macOS protocol metadata
        if: matrix.target == 'mac'
        shell: bash
        run: |
          APP=$(find release -maxdepth 2 -name 'CheezyClash.app' -print -quit)
          test -n "$APP"
          test ! -d "$APP/Contents/Resources/private"
          plutil -p "$APP/Contents/Info.plist" | grep -q 'cheezyclash'
      - name: Upload Windows artifacts
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: CheezyClash-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: CheezyClash-linux
          path: desktop/release/*
          if-no-files-found: ignore
      - name: Upload macOS artifacts
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: CheezyClash-macos-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: ignore
