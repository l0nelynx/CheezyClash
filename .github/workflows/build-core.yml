name: Build Clash Core

# Builds libclash.so for all ABIs and desktop mihomo sidecars from the same
# Go sources hash. Publishes under tag libclash-<go_hash>:
#   - libclash-v2-<hash>.zip (paired stripped binaries + original symbols)
#   - mihomo-<hash>-<goos>-<goarch>.zip (windows/linux/darwin × amd64/arm64)
# Consumed by Android CI and desktop `npm run fetch-core`.

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild libclash even if cache exists"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'core/src/main/golang/**'
      - 'core/build.gradle.kts'
      - 'scripts/native_symbols.py'
      - 'scripts/validate_native_cache.py'
      - 'scripts/publish_core.py'
      - 'core/src/main/cpp/CMakeLists.txt'
      - '.github/workflows/build-core.yml'
      - '.github/actions/libclash/**'
      - 'desktop/scripts/core-build-info.mjs'
      - 'desktop/scripts/core-manifest.mjs'
      - 'desktop/scripts/verify-core-parity.mjs'
      - 'desktop/scripts/write-core-manifest.mjs'
  push:
    branches: [main]
    paths:
      - 'core/src/main/golang/**'
      - 'core/build.gradle.kts'
      - 'scripts/native_symbols.py'
      - 'scripts/validate_native_cache.py'
      - 'scripts/publish_core.py'
      - 'core/src/main/cpp/CMakeLists.txt'
      - '.github/workflows/build-core.yml'
      - '.github/actions/libclash/**'
      - 'desktop/scripts/core-build-info.mjs'
      - 'desktop/scripts/core-manifest.mjs'
      - 'desktop/scripts/verify-core-parity.mjs'
      - 'desktop/scripts/write-core-manifest.mjs'

permissions:
  contents: write

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Test CI recovery scripts
        run: python3 scripts/test_ci_resilience.py

      - name: Compute Go sources hash
        id: hash
        run: |
          HASH=$(
            cd core/src/main/golang
            find . \( -name '*.go' -o -name 'go.sum' -o -name 'go.mod' \) -type f \
              | LC_ALL=C sort \
              | xargs sha256sum \
              | awk '{print $1}' \
              | sha256sum \
              | cut -c1-16
          )
          echo "go_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Go sources hash: $HASH"

      - name: Restore libclash cache
        id: cache-libclash
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_rebuild) }}
        uses: actions/cache/restore@v6
        with:
          path: core/build/generatedJniLibs
          key: libclash-v2-${{ steps.hash.outputs.go_hash }}

      - name: Validate cached native binaries
        id: verified-cache
        if: steps.cache-libclash.outputs.cache-hit == 'true'
        run: python3 scripts/validate_native_cache.py core/build/generatedJniLibs scripts/native_symbols.py

      - name: Set up JDK 21
        if: steps.verified-cache.outputs.valid != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Always set up Go: sidecar builds need it even when libclash is cached.
      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/main/golang/go.sum

      - name: Install Android SDK + NDK 28.2.13676358
        if: steps.verified-cache.outputs.valid != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;28.2.13676358 cmake;3.22.1"

      - name: Build libclash.so for all ABIs
        if: steps.verified-cache.outputs.valid != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --parallel \
            :core:buildGoClashArm64V8a \
            :core:buildGoClashArmeabiV7a \
            :core:buildGoClashX86_64 \
            :core:assembleGoJniLibs

      - name: Verify outputs
        run: |
          python3 scripts/native_symbols.py verify-core --input core/build/generatedJniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="core/build/generatedJniLibs/$abi/libclash.so"
            test -f "$f" || { echo "ERROR: $f missing"; exit 1; }
            ls -lh "$f"
            file "$f"
          done

      - name: Save libclash to Actions cache
        if: steps.cache-libclash.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: core/build/generatedJniLibs
          key: libclash-v2-${{ steps.hash.outputs.go_hash }}

      - name: Package libclash zip
        run: |
          HASH="${{ steps.hash.outputs.go_hash }}"
          ZIP="libclash-v2-${HASH}.zip"
          cd core/build/generatedJniLibs
          zip -r "/tmp/${ZIP}" arm64-v8a armeabi-v7a x86_64 symbols symbols-manifest.json
          ls -lh "/tmp/${ZIP}"

      - name: Build desktop mihomo sidecars
        run: |
          set -euo pipefail
          HASH="${{ steps.hash.outputs.go_hash }}"
          GO_DIR="$PWD/core/src/main/golang"
          OUT_DIR="$PWD/core/build/mihomo-sidecars"
          mkdir -p "$OUT_DIR"

          # Single parser shared with desktop packaging. It understands a
          # module-level replace and returns fork@pseudo-version.
          MIHOMO_VER=$(node desktop/scripts/mihomo-version.mjs)
          if [ -z "$MIHOMO_VER" ] || [ "$MIHOMO_VER" = "unknown" ]; then
            echo "ERROR: unable to resolve mihomo version from $GO_DIR/go.mod"
            exit 1
          fi
          echo "mihomoVersion=$MIHOMO_VER"
          printf '%s\n' "$MIHOMO_VER" > "$OUT_DIR/mihomo-version.txt"

          TARGETS=(
            "windows/amd64"
            "windows/arm64"
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            BIN="mihomo"
            if [ "$GOOS" = "windows" ]; then
              BIN="mihomo.exe"
            fi
            STAGE="$OUT_DIR/stage-${GOOS}-${GOARCH}"
            mkdir -p "$STAGE"
            echo "Building mihomo ${GOOS}/${GOARCH}…"
            (
              cd "$GO_DIR"
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -mod=readonly -tags with_gvisor,no_zerotier -trimpath \
                -ldflags="-s -w -X 'github.com/metacubex/mihomo/constant.Version=${MIHOMO_VER}'" \
                -o "$STAGE/$BIN" github.com/metacubex/mihomo
            )
            node desktop/scripts/verify-core-parity.mjs \
              "$STAGE/$BIN" core/build/generatedJniLibs/x86_64/libclash.so
            node desktop/scripts/write-core-manifest.mjs \
              "$STAGE/$BIN" "$STAGE/core-build.json" "$GO_DIR" "$GOOS" "$GOARCH"
            # Bundle version label next to the binary (About reads this file)
            cp "$OUT_DIR/mihomo-version.txt" "$STAGE/mihomo-version.txt"
            ZIP="mihomo-${HASH}-${GOOS}-${GOARCH}.zip"
            (cd "$STAGE" && zip -q "${OUT_DIR}/${ZIP}" "$BIN" mihomo-version.txt core-build.json)
            ls -lh "${OUT_DIR}/${ZIP}"
            rm -rf "$STAGE"
          done

      - name: Publish core GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HASH="${{ steps.hash.outputs.go_hash }}"
          TAG="libclash-${HASH}"
          LIBZIP="/tmp/libclash-v2-${HASH}.zip"
          SIDE_DIR="$PWD/core/build/mihomo-sidecars"
          NOTES="Prebuilt libclash.so and desktop mihomo sidecars for Go sources hash \`${HASH}\`. Used by CheezyVPN / desktop fetch-core."

          SIDECARS=(
            "mihomo-${HASH}-windows-amd64.zip"
            "mihomo-${HASH}-windows-arm64.zip"
            "mihomo-${HASH}-linux-amd64.zip"
            "mihomo-${HASH}-linux-arm64.zip"
            "mihomo-${HASH}-darwin-amd64.zip"
            "mihomo-${HASH}-darwin-arm64.zip"
          )

          ASSETS=("$LIBZIP")
          for f in "${SIDECARS[@]}"; do
            ASSETS+=("${SIDE_DIR}/${f}")
          done
          python3 scripts/publish_core.py "$TAG" "${ASSETS[@]}"

      - name: Upload libclash workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: libclash-v2-${{ steps.hash.outputs.go_hash }}
          path: core/build/generatedJniLibs/
          retention-days: 3
          if-no-files-found: error

      - name: Upload desktop sidecar workflow artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-sidecars-${{ steps.hash.outputs.go_hash }}
          path: core/build/mihomo-sidecars/*.zip
          retention-days: 3
          if-no-files-found: error
