name: PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'baselineprofile/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/native_symbols.py'
      - 'scripts/validate_native_cache.py'
      - 'scripts/download_ci.py'
      - '.github/workflows/pr-check.yml'
      - '.github/actions/libclash/**'

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK + NDK 28.2.13676358
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;28.2.13676358 cmake;3.22.1"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Acquire libclash
        id: libclash
        uses: ./.github/actions/libclash
        with:
          allow-build-fallback: 'true'

      - name: Go crash output and tunnel regression tests
        working-directory: core/src/main/golang
        run: go test ./native/crashoutput ./native/tunnel

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble, test and lint Direct Open Debug
        run: |
          ./gradlew --no-daemon \
            assembleDirectOpenDebug \
            testDirectOpenDebugUnitTest \
            lintDirectOpenDebug \
            -PfirebaseEnabled=false \
            -x :core:buildGoClashArm64V8a \
            -x :core:buildGoClashArmeabiV7a \
            -x :core:buildGoClashX86_64 \
            -x :core:assembleGoJniLibs
